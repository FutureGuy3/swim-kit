<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swim Kit</title>
<meta name="description" content="競泳の大会当日の持ち物チェックリスト">
<meta name="theme-color" content="#04182b">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
<meta name="apple-mobile-web-app-title" content="Swim Kit">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2304182b'/%3E%3Cpath d='M10 38c6 0 6-5 11-5s6 5 11 5 6-5 11-5 6 5 11 5' fill='none' stroke='%232ff3e0' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M10 48c6 0 6-5 11-5s6 5 11 5 6-5 11-5 6 5 11 5' fill='none' stroke='%23ff4f5e' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='40' cy='20' r='6' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --font-d:'Archivo',system-ui,sans-serif;
  --font-j:'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;
  --radius:22px;
  --c0:#2ff3e0;--c1:#ff4f5e;--c2:#ffd23f;--c3:#5b9dff;--c4:#b388ff;--c5:#ff9f43;
}
:root,[data-theme="dark"]{
  --bg:#04182b;--bg-deep:#020c17;--glow:#0b5a80;
  --card:rgba(255,255,255,.045);--card-solid:#0a2a46;--line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.16);
  --text:#eaf6ff;--muted:#8db1c9;--faint:#5b7d96;
  --aqua:#2ff3e0;--aqua-ink:#03252b;--red:#ff4f5e;--gold:#ffd23f;
  --rope-bg:rgba(255,255,255,.08);--input-bg:rgba(255,255,255,.06);
  --shadow:0 18px 40px -20px rgba(0,0,0,.6);
  --caustic:rgba(47,243,224,.10);
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#e8f6fa;--bg-deep:#d6eef5;--glow:#a7e3f2;
  --card:rgba(255,255,255,.78);--card-solid:#ffffff;--line:rgba(4,40,70,.09);--line-2:rgba(4,40,70,.18);
  --text:#062a45;--muted:#4f7590;--faint:#8aa7bb;
  --aqua:#00b8ab;--aqua-ink:#ffffff;--red:#ef3b4c;--gold:#e9a800;
  --rope-bg:rgba(4,40,70,.08);--input-bg:rgba(4,40,70,.05);
  --shadow:0 18px 40px -24px rgba(4,40,70,.35);
  --caustic:rgba(0,170,200,.10);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;color:var(--text);font-family:var(--font-j);
  background:
    radial-gradient(900px 520px at 15% -8%,var(--glow) 0%,transparent 62%),
    radial-gradient(700px 500px at 110% 30%,color-mix(in srgb,var(--glow) 55%,transparent) 0%,transparent 60%),
    linear-gradient(180deg,var(--bg) 0%,var(--bg-deep) 100%) fixed;
  background-color:var(--bg);
  -webkit-tap-highlight-color:transparent;
}
[data-theme="light"] body{
  background:
    linear-gradient(rgba(4,60,100,.045) 1px,transparent 1px) 0 0/30px 30px,
    linear-gradient(90deg,rgba(4,60,100,.045) 1px,transparent 1px) 0 0/30px 30px,
    radial-gradient(900px 520px at 15% -8%,var(--glow) 0%,transparent 62%),
    linear-gradient(180deg,var(--bg) 0%,var(--bg-deep) 100%);
  background-attachment:fixed;
}
/* caustics */
.caustics{position:fixed;inset:-20%;pointer-events:none;z-index:0;opacity:.9;
  background:
    radial-gradient(closest-side,var(--caustic),transparent) 10% 20%/38% 30% no-repeat,
    radial-gradient(closest-side,var(--caustic),transparent) 70% 10%/30% 26% no-repeat,
    radial-gradient(closest-side,var(--caustic),transparent) 40% 60%/44% 34% no-repeat,
    radial-gradient(closest-side,var(--caustic),transparent) 85% 75%/30% 30% no-repeat;
  filter:blur(18px);animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(4%,3%,0) rotate(4deg) scale(1.05)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:0 16px calc(48px + env(safe-area-inset-bottom))}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;margin:0 -16px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex;align-items:center;gap:10px;
  background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
  border-bottom:1px solid var(--line)}
.topbar .bar{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:linear-gradient(90deg,var(--aqua),var(--gold));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto}
.brand svg{width:30px;height:30px}
.brand b{font-family:var(--font-d);font-style:italic;font-weight:900;font-stretch:125%;font-size:20px;letter-spacing:.02em}
.brand b span{color:var(--aqua)}
.pill{height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--line-2);display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:14px;transition:background .2s,border-color .2s,color .2s}
.pill svg{width:16px;height:16px}
.pill:active{transform:scale(.97)}
.editing .pill.edit{background:var(--aqua);color:var(--aqua-ink);border-color:var(--aqua)}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center}
.icon-btn svg{width:18px;height:18px}

/* hero */
.hero{position:relative;margin:18px 0 10px;padding:18px;border-radius:28px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);overflow:hidden;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;
  background:radial-gradient(circle at 5px 3.5px,var(--red) 3.2px,transparent 3.8px) 0 0/11px 7px repeat-x;opacity:.0}
.hero-grid{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
.clock{width:132px;height:132px;display:block}
.clock .num{font-family:var(--font-d);font-weight:800;font-stretch:90%;font-size:15px;fill:var(--text)}
.clock .tick{stroke:var(--faint)}
.clock .tick.major{stroke:var(--text)}
.clock .track{stroke:var(--rope-bg)}
.clock .arc{stroke:var(--aqua);transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1),stroke .3s}
.clock .hand{transition:transform .9s cubic-bezier(.3,1.4,.4,1)}
.complete .clock .arc{stroke:var(--gold)}
.eyebrow{font-family:var(--font-d);font-weight:800;font-stretch:120%;font-size:11px;letter-spacing:.18em;color:var(--aqua)}
.meet-name{display:block;width:100%;margin:4px 0 2px;border:0;border-bottom:1px dashed transparent;background:none;padding:2px 0;font-weight:900;font-size:20px;line-height:1.3;outline:none}
.meet-name::placeholder{color:var(--faint)}
.meet-name:focus{border-bottom-color:var(--aqua)}
.meet-date{border:0;background:var(--input-bg);border-radius:10px;padding:5px 9px;font-family:var(--font-d);font-weight:600;font-size:13px;color:var(--muted);outline:none;min-height:30px}
.meet-date:focus{box-shadow:0 0 0 2px var(--aqua)}
.stat{display:flex;align-items:baseline;gap:8px;margin-top:10px}
.stat b{font-family:var(--font-d);font-style:italic;font-weight:900;font-stretch:115%;font-size:38px;line-height:1;letter-spacing:-.01em}
.stat b small{font-size:20px;color:var(--muted);font-weight:800}
.stat span{font-family:var(--font-d);font-weight:800;font-stretch:120%;font-size:11px;letter-spacing:.16em;color:var(--muted)}
.status{margin:4px 0 0;font-size:13px;color:var(--muted);font-weight:500}
.complete .status{color:var(--gold);font-weight:700}
.complete .stat b{color:var(--gold)}

.seg{display:flex;gap:4px;margin-top:16px;padding:4px;border-radius:14px;background:var(--input-bg)}
.seg button{flex:1;height:36px;border-radius:10px;font-weight:700;font-size:13px;color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--card-solid);color:var(--text);box-shadow:0 2px 10px -4px rgba(0,0,0,.4)}

/* bubbles celebration */
.bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bubbles i{position:absolute;bottom:-20px;border-radius:50%;border:1.5px solid var(--aqua);opacity:0}
.celebrate .bubbles i{animation:rise 2.4s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:.9}100%{opacity:0;transform:translateY(-220px) scale(1.2)}}

/* categories */
.list{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.cat{--c:var(--c0);border-radius:var(--radius);border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow:hidden;animation:in .45s both cubic-bezier(.2,.8,.2,1);animation-delay:calc(var(--i,0)*40ms)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.cat-head{display:flex;align-items:center;gap:12px;padding:14px 14px 10px 14px}
.cat-icon{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:21px;
  background:color-mix(in srgb,var(--c) 18%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent)}
.cat.is-edit .cat-icon{box-shadow:inset 0 0 0 1.5px var(--c);cursor:pointer}
.cat.solo{border-color:color-mix(in srgb,var(--aqua) 55%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--aqua) 35%,transparent),var(--shadow)}
.cat-edit-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.cat-edit-btn svg{width:16px;height:16px}
.cat-edit-btn:hover{background:var(--input-bg);color:var(--text)}
.done-btn{flex:none;height:34px;padding:0 14px;border-radius:999px;background:var(--aqua);color:var(--aqua-ink);font-weight:800;font-size:13px}
.cat-title{flex:1;min-width:0}
.cat-name{margin:0;font-size:16.5px;font-weight:900;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-count{font-family:var(--font-d);font-weight:700;font-stretch:110%;font-size:12px;color:var(--muted);letter-spacing:.06em}
.cat.done .cat-count{color:var(--gold)}
.chev{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--input-bg);transition:transform .3s;transform:rotate(180deg)}
.chev svg{width:18px;height:18px}
.cat.collapsed .chev{transform:none;color:var(--text)}
.cat.collapsed .cat-head{padding-bottom:10px}
.rope{margin:0 14px 6px;height:6px;border-radius:3px;background:var(--rope-bg);overflow:hidden}
.rope span{display:block;height:100%;width:0;border-radius:3px;
  background:repeating-linear-gradient(90deg,var(--c) 0 9px,color-mix(in srgb,var(--c) 45%,transparent) 9px 12px);
  transition:width .5s cubic-bezier(.2,.8,.2,1)}
.cat.done .rope span{background:repeating-linear-gradient(90deg,var(--gold) 0 9px,color-mix(in srgb,var(--gold) 50%,transparent) 9px 12px)}
.items{list-style:none;margin:0;padding:2px 6px 8px}
.cat.collapsed .items,.cat.collapsed .cat-empty{display:none}
.item{width:100%;display:flex;align-items:center;gap:13px;min-height:50px;padding:8px 10px;border-radius:14px;text-align:left;transition:background .15s}
.item:hover{background:var(--input-bg)}
.item:active{transform:scale(.99)}
.box{flex:none;width:25px;height:25px;border-radius:8px;border:2px solid var(--line-2);display:grid;place-items:center;transition:background .2s,border-color .2s}
.box svg{width:15px;height:15px;stroke:var(--aqua-ink);stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .25s .05s}
.label{font-size:15.5px;font-weight:500;line-height:1.35;transition:color .2s}
li.checked .box{background:var(--aqua);border-color:var(--aqua)}
li.checked .box svg{stroke-dashoffset:0}
li.checked .label{color:var(--faint);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--aqua) 70%,transparent);text-decoration-thickness:2px}
li.just .box{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
li.leaving{animation:out .32s forwards}
@keyframes out{to{opacity:0;transform:translateX(24px);height:0;min-height:0}}
.cat-empty{margin:2px 16px 14px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.cat-empty b{color:var(--gold);font-family:var(--font-d);font-style:italic;font-stretch:120%;letter-spacing:.08em;font-size:12px}

/* edit mode */
.edit-input{width:100%;min-width:0;border:0;background:var(--input-bg);border-radius:10px;padding:8px 10px;outline:none;font-weight:700}
.edit-input:focus{box-shadow:0 0 0 2px var(--aqua)}
.cat-name-input{font-size:16px;font-weight:900}
.ctrls{display:flex;gap:2px;flex:none}
.mini{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.mini svg{width:16px;height:16px}
.mini:hover{background:var(--input-bg);color:var(--text)}
.mini.del:hover{color:var(--red)}
.mini:disabled{opacity:.25;pointer-events:none}
li.erow{display:flex;align-items:center;gap:6px;padding:4px 4px 4px 8px}
li.erow .edit-input{font-weight:500;font-size:15px}
.add-item{display:flex;gap:6px;padding:4px 10px 14px 12px}
.add-item input{flex:1}
.add-btn{flex:none;height:38px;padding:0 14px;border-radius:10px;background:var(--aqua);color:var(--aqua-ink);font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.add-btn svg{width:15px;height:15px}
.picker{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:0 14px 10px;padding:8px;border-radius:14px;background:var(--input-bg)}
.picker button{aspect-ratio:1;border-radius:10px;font-size:20px}
.picker button:hover,.picker button.on{background:var(--card-solid)}
.add-cat{display:flex;align-items:center;justify-content:center;gap:8px;min-height:64px;border-radius:var(--radius);border:2px dashed var(--line-2);color:var(--muted);font-weight:800;font-size:15px;transition:border-color .2s,color .2s}
.add-cat:hover{border-color:var(--aqua);color:var(--aqua)}
.add-cat svg{width:18px;height:18px}
.edit-hint{margin:14px 2px 0;font-size:12.5px;color:var(--muted);display:none}
.editing .edit-hint{display:block}

footer{margin-top:28px;text-align:center;font-size:11.5px;color:var(--faint);line-height:1.7}
footer b{font-family:var(--font-d);font-style:italic;font-stretch:125%;letter-spacing:.06em}

/* sheet & modal */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(1,8,16,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:640px;margin:0 auto;padding:10px 16px calc(20px + env(safe-area-inset-bottom));
  border-radius:26px 26px 0 0;background:var(--card-solid);border:1px solid var(--line);box-shadow:0 -20px 50px -20px rgba(0,0,0,.5);
  transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.2,1);max-height:88vh;overflow:auto}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line-2);margin:0 auto 12px}
.sheet h3{margin:4px 4px 10px;font-family:var(--font-d);font-style:italic;font-weight:900;font-stretch:125%;font-size:15px;letter-spacing:.08em}
.group{border-radius:16px;background:var(--input-bg);overflow:hidden;margin-bottom:12px}
.row{width:100%;display:flex;align-items:center;gap:12px;min-height:50px;padding:0 14px;text-align:left;font-weight:600;font-size:15px}
.row+.row{border-top:1px solid var(--line)}
.row svg{width:19px;height:19px;color:var(--muted);flex:none}
.row small{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.row.danger,.row.danger svg{color:var(--red)}
.row:active{background:var(--line)}
.theme-row{justify-content:space-between}
.theme-row .seg{margin:0;flex:none}
.theme-row .seg button{flex:none;padding:0 12px;height:32px}
.modal{position:fixed;z-index:51;left:50%;top:50%;width:min(360px,calc(100vw - 32px));transform:translate(-50%,-46%) scale(.96);opacity:0;pointer-events:none;
  padding:22px 20px 16px;border-radius:24px;background:var(--card-solid);border:1px solid var(--line);box-shadow:0 30px 60px -20px rgba(0,0,0,.6);transition:all .22s}
.modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.modal h4{margin:0 0 6px;font-size:17px;font-weight:900}
.modal p{margin:0 0 18px;font-size:14px;color:var(--muted);line-height:1.6}
.modal .btns{display:flex;gap:8px}
.modal .btns button{flex:1;height:44px;border-radius:13px;font-weight:800;font-size:14px;background:var(--input-bg)}
.modal .btns .ok{background:var(--aqua);color:var(--aqua-ink)}
.modal .btns .ok.danger{background:var(--red);color:#fff}
#scrim2{z-index:50}
.toast{position:fixed;z-index:60;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,140%);display:flex;align-items:center;gap:14px;
  max-width:calc(100vw - 32px);padding:11px 12px 11px 18px;border-radius:16px;background:var(--text);color:var(--bg);font-weight:700;font-size:14px;
  box-shadow:0 16px 40px -14px rgba(0,0,0,.6);transition:transform .35s cubic-bezier(.2,.9,.2,1),visibility .35s;visibility:hidden;white-space:nowrap;transform:translate(-50%,calc(100% + 60px))}
.toast.show{transform:translate(-50%,0);visibility:visible}
.toast span{overflow:hidden;text-overflow:ellipsis}
.toast button{padding:7px 12px;border-radius:10px;background:var(--aqua);color:var(--aqua-ink);font-weight:800;font-size:13px}
.toast button[hidden]{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:380px){
  .hero-grid{grid-template-columns:108px 1fr;gap:12px}
  .clock{width:108px;height:108px}
  .stat b{font-size:32px}
  .pill span{display:none}.pill{padding:0 11px}
}
@media (min-width:600px){.wrap{padding-top:6px}.hero{padding:22px}.hero-grid{grid-template-columns:150px 1fr;gap:22px}.clock{width:150px;height:150px}}
</style>
</head>
<body>
<div class="caustics" aria-hidden="true"></div>
<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="var(--aqua)" opacity=".14"/><path d="M10 38c6 0 6-5 11-5s6 5 11 5 6-5 11-5 6 5 11 5" fill="none" stroke="var(--aqua)" stroke-width="5" stroke-linecap="round"/><path d="M10 48c6 0 6-5 11-5s6 5 11 5 6-5 11-5 6 5 11 5" fill="none" stroke="var(--red)" stroke-width="5" stroke-linecap="round"/><circle cx="40" cy="20" r="6" fill="var(--text)"/></svg>
      <b>SWIM <span>KIT</span></b>
    </div>
    <button class="pill edit" id="editBtn" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>
      <span id="editLabel">編集</span>
    </button>
    <button class="icon-btn" id="menuBtn" aria-label="メニュー">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
    <div class="bar" id="topBar"></div>
  </header>

  <section class="hero" id="hero">
    <div class="bubbles" aria-hidden="true" id="bubbles"></div>
    <div class="hero-grid">
      <svg class="clock" id="clock" viewBox="0 0 200 200" role="img" aria-label="準備の進み具合"></svg>
      <div>
        <div class="eyebrow">NEXT MEET</div>

<script>
(() => {
'use strict';
const STORE = 'swimkit.v1';
const ICONS = ['🏁','🏊','🥽','🩱','🧢','👕','🩴','🧘','💆','🩹','🧴','👓','🍙','⚡','💊','🥤','📱','📷','🔋','🎧','🎒','🧳','⏱️','🏆'];
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const SEED = [
  ['レース装備','🏁',['ADカード','レース用水着','レース用ゴーグル','レース用キャップ']],
  ['アップ・練習','🏊',['練習用水着','練習用ゴーグル','練習用キャップ','セームタオル','テンポトレーナー','濡れたものを入れるビニール袋']],
  ['ウェア','👕',['Tシャツ','短パン','ジャージ上','ジャージ下','サンダル']],
  ['コンディショニング','🧘',['ヨガマット','ストレッチポール','チューブ','マッサージボール','バンドエイド']],
  ['身だしなみ・ケア','🧴',['コンタクトレンズ','メガネケース','シャンプー','クリーム']],
  ['栄養補給','🍙',['おにぎり','ゼリー飲料','プロテインバー','カフェイン','EAA','ゴミ袋']],
  ['デバイス・撮影','📱',['レース用スマホ','カメラ','バッテリー','三脚']],
];
// 泊まりの大会用:頻度が低いので最下段・初期状態は折りたたみ
const STAY = ['宿泊','🧳',['航空券・新幹線チケット','ホテル予約票','スマホ充電器・ケーブル','常備薬やのど飴など',
  '替え下着','着替え(翌日分)','洗面用具(歯ブラシ・洗顔など)','必要な寝具(寝間着・枕など)'], true];
const mkCat = ([name, icon, items, collapsed]) => ({
  id: uid(), name, icon, collapsed: !!collapsed,
  items: items.map(n => ({ id: uid(), name: n, checked: false }))
});
const defaultCats = () => [...SEED, STAY].map(mkCat);
const SCHEMA = 2;
// v1で保存されたリストに v2 の追加分を反映(ユーザーのカスタマイズは保持)
function migrate(st) {
  if ((st.schema || 1) < 2) {
    const fuel = st.categories.find(c => c.name === '栄養補給');
    if (fuel && !fuel.items.some(i => i.name === 'ゴミ袋')) fuel.items.push({ id: uid(), name: 'ゴミ袋', checked: false });
    if (!st.categories.some(c => c.name === STAY[0])) st.categories.push(mkCat(STAY));
  }
  st.schema = SCHEMA;
  return st;
}

function normalize(d) {
  const out = { meet: { name: '', date: '' }, prefs: { filter: 'all', theme: 'auto' }, categories: [] };
  if (!d || !Array.isArray(d.categories)) return null;
  if (d.meet) { out.meet.name = String(d.meet.name || '').slice(0, 40); out.meet.date = String(d.meet.date || ''); }
  if (d.prefs) { out.prefs.filter = d.prefs.filter === 'todo' ? 'todo' : 'all'; out.prefs.theme = ['light','dark'].includes(d.prefs.theme) ? d.prefs.theme : 'auto'; }
  out.categories = d.categories.map(c => ({
    id: uid(), name: String(c.name || '新しいジャンル').slice(0, 30), icon: String(c.icon || '🎒').slice(0, 8),
    collapsed: !!c.collapsed,
    items: (Array.isArray(c.items) ? c.items : []).map(i => typeof i === 'string' ? { id: uid(), name: i, checked: false }
      : { id: uid(), name: String(i.name || '').slice(0, 60), checked: !!i.checked }).filter(i => i.name)
  }));
  out.schema = Number(d.schema) || 1;
  return out;
}
function load() {
  try { const raw = localStorage.getItem(STORE); if (raw) { const n = normalize(JSON.parse(raw)); if (n) { const m = migrate(n); localStorage.setItem(STORE, JSON.stringify(m)); return m; } } } catch (e) {}
  return { schema: SCHEMA, meet: { name: '', date: '' }, prefs: { filter: 'all', theme: 'auto' }, categories: defaultCats() };
}
let state = load();
const ui = { edit: false, editCat: null, picker: null };
let wasComplete = null;
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} };
const snapshot = () => JSON.stringify(state);
const findCat = id => state.categories.find(c => c.id === id);

/* ---------- theme ---------- */
const mq = matchMedia('(prefers-color-scheme: light)');
function applyTheme() {
  const t = state.prefs.theme === 'auto' ? (mq.matches ? 'light' : 'dark') : state.prefs.theme;
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name=theme-color]').content = t === 'light' ? '#e8f6fa' : '#04182b';
  document.querySelectorAll('[data-theme-set]').forEach(b => b.setAttribute('aria-pressed', b.dataset.themeSet === state.prefs.theme));
}
mq.addEventListener?.('change', applyTheme);

/* ---------- pace clock ---------- */

(function buildClock() {
  let s = `<circle cx="100" cy="100" r="96" fill="var(--card-solid)" opacity=".55"/>`;
  for (let i = 0; i < 60; i++) {
    const major = i % 5 === 0, a = i * 6 * Math.PI / 180, r1 = 92, r2 = major ? 81 : 86;
    s += `<line class="tick${major ? ' major' : ''}" x1="${100 + r1 * Math.sin(a)}" y1="${100 - r1 * Math.cos(a)}" x2="${100 + r2 * Math.sin(a)}" y2="${100 - r2 * Math.cos(a)}" stroke-width="${major ? 2.6 : 1.2}" stroke-linecap="round"/>`;
  }
  [[60,0],[15,90],[30,180],[45,270]].forEach(([n, d]) => {
    const a = d * Math.PI / 180;
    s += `<text class="num" x="${100 + 66 * Math.sin(a)}" y="${100 - 66 * Math.cos(a) + 5.5}" text-anchor="middle">${n}</text>`;
  });
  s += `<circle class="track" cx="100" cy="100" r="50" fill="none" stroke-width="9"/>`;
  s += `<circle class="arc" id="arc" cx="100" cy="100" r="50" fill="none" stroke-width="9" stroke-linecap="round" transform="rotate(-90 100 100)" stroke-dasharray="${2*Math.PI*50}" stroke-dashoffset="${2*Math.PI*50}"/>`;
  s += `<g class="hand" id="hand" style="transform-origin:100px 100px"><line x1="100" y1="118" x2="100" y2="20" stroke="var(--red)" stroke-width="3" stroke-linecap="round"/><circle cx="100" cy="122" r="5" fill="var(--red)"/></g>`;
  s += `<circle cx="100" cy="100" r="6" fill="var(--text)"/><circle cx="100" cy="100" r="2.5" fill="var(--red)"/>`;
  $('#clock').innerHTML = s;
})();
for (let i = 0; i < 16; i++) {
  const b = document.createElement('i'), sz = 6 + Math.random() * 14;
  Object.assign(b.style, { left: Math.random() * 100 + '%', width: sz + 'px', height: sz + 'px', animationDelay: Math.random() * .9 + 's' });
  $('#bubbles').appendChild(b);
}

/* ---------- icons ---------- */
const I = {
  check: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>',
  del: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  pen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
};

/* ---------- render ---------- */
const list = $('#list');
function catHTML(c, ci) {
  const total = c.items.length, done = c.items.filter(i => i.checked).length;
  const isDone = total > 0 && done === total;
  const color = `var(--c${ci % 6})`;
  const n = state.categories.length;
  const solo = !ui.edit && ui.editCat === c.id;   // このジャンルだけ編集中
  const ed = ui.edit || solo;
  let h = `<section class="cat${c.collapsed && !ed ? ' collapsed' : ''}${isDone ? ' done' : ''}${ed ? ' is-edit' : ''}${solo ? ' solo' : ''}" data-cid="${c.id}" style="--c:${color};--i:${ci}">`;
  h += `<div class="cat-head">`;
  h += `<button class="cat-icon" data-act="${ed ? 'icon' : 'collapse'}" aria-label="${ed ? 'アイコンを変更' : '開閉'}">${esc(c.icon)}</button>`;
  if (solo) {
    h += `<div class="cat-title"><input class="edit-input cat-name-input" data-act="catname" value="${esc(c.name)}" maxlength="30" aria-label="ジャンル名"></div>`;
    h += `<button class="done-btn" data-act="cat-edit-done">完了</button>`;
  } else if (ui.edit) {
    h += `<div class="cat-title"><input class="edit-input cat-name-input" data-act="catname" value="${esc(c.name)}" maxlength="30" aria-label="ジャンル名"></div>`;
    h += `<div class="ctrls"><button class="mini" data-act="cat-up" ${ci === 0 ? 'disabled' : ''} aria-label="上へ">${I.up}</button><button class="mini" data-act="cat-down" ${ci === n - 1 ? 'disabled' : ''} aria-label="下へ">${I.down}</button><button class="mini del" data-act="cat-del" aria-label="ジャンルを削除">${I.del}</button></div>`;
  } else {
    h += `<div class="cat-title" data-act="collapse" style="cursor:pointer"><h2 class="cat-name">${esc(c.name)}</h2><div class="cat-count">${done} / ${total}</div></div>`;
    h += `<button class="cat-edit-btn" data-act="cat-edit" aria-label="このジャンルを編集">${I.pen}</button>`;
    h += `<button class="chev" data-act="collapse" aria-label="開閉" aria-expanded="${!c.collapsed}">${I.chev}</button>`;
  }
  h += `</div>`;
  if (ed && ui.picker === c.id) {
    h += `<div class="picker">${ICONS.map(ic => `<button data-act="pick" data-icon="${ic}" class="${ic === c.icon ? 'on' : ''}">${ic}</button>`).join('')}</div>`;
  }
  h += `<div class="rope"><span style="width:${total ? done / total * 100 : 0}%"></span></div>`;
  const items = (!ed && state.prefs.filter === 'todo') ? c.items.filter(i => !i.checked) : c.items;
  h += `<ul class="items">`;
  items.forEach((it, ii) => {
    if (ed) {
      h += `<li class="erow" data-iid="${it.id}"><input class="edit-input" data-act="itemname" value="${esc(it.name)}" maxlength="60" aria-label="アイテム名">`
        + `<button class="mini" data-act="item-up" ${ii === 0 ? 'disabled' : ''} aria-label="上へ">${I.up}</button>`
        + `<button class="mini" data-act="item-down" ${ii === items.length - 1 ? 'disabled' : ''} aria-label="下へ">${I.down}</button>`
        + `<button class="mini del" data-act="item-del" aria-label="削除">${I.x}</button></li>`;
    } else {
      h += `<li class="${it.checked ? 'checked' : ''}" data-iid="${it.id}"><button class="item" data-act="toggle" aria-pressed="${it.checked}"><span class="box">${I.check}</span><span class="label">${esc(it.name)}</span></button></li>`;
    }
  });
  h += `</ul>`;
  if (!ed && items.length === 0) {
    h += `<div class="cat-empty">${total === 0 ? 'アイテムがありません。「編集」から追加できます' : '<b>ALL PACKED</b> このジャンルは準備OK'}</div>`;
  }
  if (ed) {
    h += `<form class="add-item" data-cid="${c.id}"><input class="edit-input" placeholder="アイテムを追加" maxlength="60" aria-label="新しいアイテム" enterkeyhint="done"><button class="add-btn" type="submit">${I.plus}追加</button></form>`;
  }
  return h + `</section>`;
}
function render() {
  document.body.classList.toggle('editing', ui.edit);
  list.innerHTML = state.categories.map(catHTML).join('')
    + (ui.edit ? `<button class="add-cat" data-act="add-cat">${I.plus}ジャンルを追加</button>` : '');
  document.querySelectorAll('#filterSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.filter === state.prefs.filter));
  $('#filterSeg').style.display = ui.edit ? 'none' : '';
  updateProgress();
}
function updateCat(sec) {
  const c = findCat(sec.dataset.cid); if (!c) return;
  const total = c.items.length, done = c.items.filter(i => i.checked).length;
  sec.querySelector('.cat-count').textContent = `${done} / ${total}`;
  sec.querySelector('.rope span').style.width = (total ? done / total * 100 : 0) + '%';
  sec.classList.toggle('done', total > 0 && done === total);
}
function updateProgress() {
  let total = 0, done = 0;
  // 閉じているジャンル(例:日帰り時の「宿泊」)は今回の対象外として全体の集計から外す
  state.categories.forEach(c => { if (c.collapsed) return; c.items.forEach(i => { total++; if (i.checked) done++; }); });
  const pct = total ? done / total : 0, complete = total > 0 && done === total;
  const c50 = 2 * Math.PI * 50;
  $('#arc').style.strokeDashoffset = c50 * (1 - pct);
  $('#hand').style.transform = `rotate(${pct * 360}deg)`;
  $('#statNum').innerHTML = `${done}<small>/${total}</small>`;
  $('#topBar').style.width = pct * 100 + '%';
  $('#status').textContent = total === 0 ? 'リストが空です。「編集」から追加しよう'
    : complete ? 'READY TO RACE — 準備完了!' : done === 0 ? `持ち物 ${total} アイテム。準備をはじめよう` : `あと ${total - done} アイテム`;
  $('#hero').classList.toggle('complete', complete);
  if (wasComplete === false && complete) celebrate();
  wasComplete = complete;
}
function celebrate() {
  const h = $('#hero'); h.classList.remove('celebrate'); void h.offsetWidth; h.classList.add('celebrate');
  setTimeout(() => h.classList.remove('celebrate'), 3200);
  toast('準備完了!ベストを尽くそう 🏊');
  navigator.vibrate?.([20, 60, 20]);
}

/* ---------- toast / modal ---------- */
let tTimer, undoSnap = null;
function toast(msg, undo) {
  $('#toastMsg').textContent = msg;
  undoSnap = undo || null; $('#toastBtn').hidden = !undo;
  $('#toast').classList.add('show'); clearTimeout(tTimer);
  tTimer = setTimeout(() => { $('#toast').classList.remove('show'); undoSnap = null; }, undo ? 4500 : 2400);
}
$('#toastBtn').onclick = () => {
  if (!undoSnap) return; state = normalizeKeepIds(JSON.parse(undoSnap)); save(); render();
  $('#toast').classList.remove('show'); undoSnap = null;
};
const normalizeKeepIds = d => d; // snapshot is our own trusted structure
function confirmBox(title, body, okLabel = 'OK', danger = false) {
  return new Promise(res => {
    $('#mTitle').textContent = title; $('#mBody').textContent = body;
    const ok = $('#mOk'); ok.textContent = okLabel; ok.classList.toggle('danger', danger);
    $('#modal').classList.add('open'); $('#scrim2').classList.add('open');
    const done = v => { $('#modal').classList.remove('open'); $('#scrim2').classList.remove('open'); ok.onclick = $('#mCancel').onclick = $('#scrim2').onclick = null; res(v); };
    ok.onclick = () => done(true); $('#mCancel').onclick = $('#scrim2').onclick = () => done(false);
  });
}

/* ---------- list events ---------- */
const move = (arr, i, d) => { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; };
list.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const sec = t.closest('.cat'), c = sec && findCat(sec.dataset.cid);
  const li = t.closest('[data-iid]'), it = li && c && c.items.find(i => i.id === li.dataset.iid);
  const act = t.dataset.act;
  if (act === 'toggle' && it) {
    it.checked = !it.checked; save();
    li.classList.toggle('checked', it.checked); t.setAttribute('aria-pressed', it.checked);
    li.classList.remove('just'); void li.offsetWidth; if (it.checked) li.classList.add('just');
    navigator.vibrate?.(8);
    updateCat(sec); updateProgress();
    if (state.prefs.filter === 'todo' && it.checked) { setTimeout(() => { li.classList.add('leaving'); setTimeout(() => { if (!ui.edit && !ui.editCat) render(); }, 300); }, 250); }
  } else if (act === 'cat-edit' && c) {
    document.activeElement?.blur();
    ui.editCat = c.id; ui.picker = null; render();
    const sec2 = list.querySelector(`[data-cid="${c.id}"]`);
    sec2?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  } else if (act === 'cat-edit-done') {
    document.activeElement?.blur();
    ui.editCat = null; ui.picker = null; render();
  } else if (act === 'collapse' && c) {
    c.collapsed = !c.collapsed; save();
    sec.classList.toggle('collapsed', c.collapsed);
    sec.querySelector('.chev')?.setAttribute('aria-expanded', !c.collapsed);
    updateProgress();
  } else if (act === 'icon' && c) {
    ui.picker = ui.picker === c.id ? null : c.id; render();
  } else if (act === 'pick' && c) {
    c.icon = t.dataset.icon; ui.picker = null; save(); render();
  } else if ((act === 'cat-up' || act === 'cat-down') && c) {
    move(state.categories, state.categories.indexOf(c), act === 'cat-up' ? -1 : 1); save(); render();
  } else if (act === 'cat-del' && c) {
    const ok = await confirmBox(`「${c.name}」を削除しますか?`, `このジャンルの ${c.items.length} アイテムも一緒に削除されます。`, '削除', true);
    if (!ok) return;
    const snap = snapshot(); state.categories = state.categories.filter(x => x !== c); save(); render();
    toast('ジャンルを削除しました', snap);
  } else if ((act === 'item-up' || act === 'item-down') && it) {
    move(c.items, c.items.indexOf(it), act === 'item-up' ? -1 : 1); save(); render();
    list.querySelector(`[data-iid="${it.id}"] [data-act="${act}"]:not(:disabled)`)?.focus();
  } else if (act === 'item-del' && it) {
    const snap = snapshot(); c.items = c.items.filter(x => x !== it); save(); render();
    toast(`「${it.name}」を削除しました`, snap);
  } else if (act === 'add-cat') {
    const nc = { id: uid(), name: '新しいジャンル', icon: '🎒', collapsed: false, items: [] };
    state.categories.push(nc); save(); render();
    const inp = list.querySelector(`[data-cid="${nc.id}"] .cat-name-input`);
    inp?.scrollIntoView({ behavior: 'smooth', block: 'center' }); inp?.focus(); inp?.select();
  }
});
list.addEventListener('input', e => {
  const t = e.target, sec = t.closest('.cat'), c = sec && findCat(sec.dataset.cid); if (!c) return;
  if (t.dataset.act === 'catname') { c.name = t.value; save(); }
  if (t.dataset.act === 'itemname') { const it = c.items.find(i => i.id === t.closest('[data-iid]').dataset.iid); if (it) { it.name = t.value; save(); } }
});
list.addEventListener('focusout', e => {
  const t = e.target, sec = t.closest?.('.cat'), c = sec && findCat(sec.dataset.cid); if (!c) return;
  if (t.dataset.act === 'catname' && !t.value.trim()) { c.name = '新しいジャンル'; t.value = c.name; save(); }
  if (t.dataset.act === 'itemname' && !t.value.trim()) {
    const id = t.closest('[data-iid]').dataset.iid, it = c.items.find(i => i.id === id);
    const snap = snapshot(); c.items = c.items.filter(i => i.id !== id); save();
    setTimeout(render, 0); if (it) toast('空のアイテムを削除しました', snap);
  }
});
list.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.target.dataset.act === 'catname' || e.target.dataset.act === 'itemname')) { e.preventDefault(); e.target.blur(); }
});
list.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, c = findCat(f.dataset.cid), inp = f.querySelector('input'), v = inp.value.trim();
  if (!c || !v) return;
  c.items.push({ id: uid(), name: v, checked: false }); save(); render();
  list.querySelector(`.add-item[data-cid="${c.id}"] input`)?.focus();
});

/* ---------- hero ---------- */
$('#meetName').value = state.meet.name; $('#meetDate').value = state.meet.date;
$('#meetName').addEventListener('input', e => { state.meet.name = e.target.value; save(); });
$('#meetName').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
$('#meetDate').addEventListener('change', e => { state.meet.date = e.target.value; save(); });
$('#filterSeg').addEventListener('click', e => {
  const b = e.target.closest('[data-filter]'); if (!b) return;
  state.prefs.filter = b.dataset.filter; save(); render();
});
$('#editBtn').addEventListener('click', () => {
  if (ui.edit) document.activeElement?.blur();
  ui.edit = !ui.edit; ui.picker = null; ui.editCat = null;
  $('#editLabel').textContent = ui.edit ? '完了' : '編集';
  $('#editBtn').setAttribute('aria-pressed', ui.edit);
  render();
});

/* ---------- menu ---------- */
const openSheet = v => { $('#sheet').classList.toggle('open', v); $('#scrim').classList.toggle('open', v); };
$('#menuBtn').onclick = () => openSheet(true);
$('#scrim').onclick = () => openSheet(false);
document.addEventListener('keydown', e => { if (e.key === 'Escape') openSheet(false); });
$('#themeSeg').addEventListener('click', e => {
  const b = e.target.closest('[data-theme-set]'); if (!b) return;
  state.prefs.theme = b.dataset.themeSet; save(); applyTheme();
});
function asText() {
  const head = `【${state.meet.name || 'Swim Kit'}】${state.meet.date ? ' ' + state.meet.date.replace(/-/g, '/') : ''}`;
  return head + '\n' + state.categories.filter(c => !c.collapsed).map(c => `\n${c.icon} ${c.name}\n` + c.items.map(i => `${i.checked ? '☑' : '☐'} ${i.name}`).join('\n')).join('\n');
}
async function copyText(s) {
  try { await navigator.clipboard.writeText(s); return true; } catch (e) {
    const ta = document.createElement('textarea'); ta.value = s; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (_) {} ta.remove(); return ok;
  }
}
$('#sheet').addEventListener('click', async e => {
  const b = e.target.closest('[data-menu]'); if (!b) return;
  const m = b.dataset.menu;
  if (m === 'uncheck') {
    openSheet(false);
    if (!await confirmBox('すべてのチェックを外しますか?', 'リストの内容はそのままで、チェックだけがリセットされます。', 'リセット')) return;
    const snap = snapshot(); state.categories.forEach(c => c.items.forEach(i => i.checked = false)); save(); render();
    toast('チェックをリセットしました', snap);
  } else if (m === 'copy') {
    openSheet(false); toast(await copyText(asText()) ? 'クリップボードにコピーしました' : 'コピーできませんでした');
  } else if (m === 'export') {
    const data = { app: 'swim-kit', version: 2, schema: SCHEMA, exportedAt: new Date().toISOString(), meet: state.meet, categories: state.categories.map(c => ({ name: c.name, icon: c.icon, items: c.items.map(i => ({ name: i.name, checked: i.checked })) })) };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `swim-kit-${new Date().toISOString().slice(0, 10)}.json`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    openSheet(false); toast('JSONを書き出しました');
  } else if (m === 'import') {
    $('#fileIn').click();
  } else if (m === 'reset') {
    openSheet(false);
    if (!await confirmBox('初期リストに戻しますか?', 'ジャンル・アイテムのカスタマイズとチェック状態がすべて初期状態に戻ります。', '初期化', true)) return;
    const snap = snapshot(); state.categories = defaultCats(); state.meet = { name: '', date: '' };
    $('#meetName').value = ''; $('#meetDate').value = ''; save(); render();
    toast('初期リストに戻しました', snap);
  }
});
$('#fileIn').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  openSheet(false);
  try {
    const n = normalize(JSON.parse(await f.text()));
    if (!n) throw new Error('bad');
    const count = n.categories.reduce((s, c) => s + c.items.length, 0);
    if (!await confirmBox('リストを読み込みますか?', `${n.categories.length} ジャンル・${count} アイテム。今のリストは置き換えられます。`, '読み込む')) return;
    const snap = snapshot(); n.prefs = state.prefs; state = migrate(n); save();
    $('#meetName').value = state.meet.name; $('#meetDate').value = state.meet.date; render();
    toast('リストを読み込みました', snap);
  } catch (err) { toast('読み込めませんでした(Swim KitのJSONを選んでください)'); }
});

applyTheme();
render();
})();
</script>
</body>
</html>
